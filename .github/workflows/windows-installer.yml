name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          choco install innosetup --no-progress -y
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build executable and installer
        shell: powershell
        run: ./build.ps1
      - name: Create checksum
        shell: powershell
        run: |
          $file = Get-Item dist/RellenoCliente-Setup-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($file.Name)" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: RellenoCliente-Windows
          path: |
            dist/RellenoCliente-Setup-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
