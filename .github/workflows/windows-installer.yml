name: Windows installer

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          choco install innosetup --no-progress -y
      - name: Run tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $PSNativeCommandUseErrorActionPreference = $false
          python -m unittest discover -s tests -v 2>&1 | Tee-Object -FilePath test-output.txt
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            "## Windows test failure" | Add-Content $env:GITHUB_STEP_SUMMARY
            '```text' | Add-Content $env:GITHUB_STEP_SUMMARY
            Get-Content test-output.txt | Add-Content $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content $env:GITHUB_STEP_SUMMARY
            $failure = (Get-Content test-output.txt -Raw).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error file=.github/workflows/windows-installer.yml,line=27,title=Windows tests failed::$failure"
            exit $testExit
          }
      - name: Build executable and installer
        shell: powershell
        env:
          RELLENO_HIKCENTRAL_PASSWORDS: ${{ secrets.RELLENO_HIKCENTRAL_PASSWORDS }}
        run: ./build.ps1
      - name: Create checksum
        shell: powershell
        run: |
          $file = Get-Item dist/RellenoCliente-Setup-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($file.Name)" | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: RellenoCliente-Windows
          path: |
            dist/RellenoCliente-Setup-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish tagged installer
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RellenoCliente-Setup-*.exe
            dist/SHA256SUMS.txt
